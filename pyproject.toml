[project]
name = "vibing"
version = "0.1.0"
description = "Vini7 Vibing: app web local para sessões do Claude Agent SDK"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.54",
    "claude-agent-sdk>=0.2.161",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/vibing"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
