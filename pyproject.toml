[project]
name = "claudio-maestro"
version = "0.1.0"
description = "Cláudio Maestro: app web local para conduzir sessões do Claude em vários projetos numa tela só"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.54",
    "claude-agent-sdk>=0.2.161",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/claudio_maestro"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
